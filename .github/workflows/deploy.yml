name: Build and deploy
run-name: ${{ inputs.validate_only && 'Validate Notion sync (no deployment)' || 'Build and deploy' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Sync Notion and build without publishing"
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}-${{ inputs.validate_only || false }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Sync published Notion notes
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python scripts/sync_notion.py
      - name: Build static site
        run: python scripts/build.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && !inputs.validate_only
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
