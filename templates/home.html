<section class="intro">
  <div class="identity-hero">
    <h1>A Piece<br>in Progress.</h1>
    <svg class="identity-symbol" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <path id="identity-name-upper" d="M18.5 5.5a7.5 7.5 0 0 1 8 7.5"/>
        <path id="identity-name-lower" d="M26.5 13a7.5 7.5 0 0 1-8 7.5"/>
      </defs>
      <path class="identity-symbol__body" fill-rule="evenodd" d="M2 2h17c6.1 0 11 4.9 11 11s-4.9 11-11 11h-7v6H2V2Zm10 8v6h7a3 3 0 1 0 0-6h-7Z"/>
      <text class="identity-symbol__name"><textPath href="#identity-name-upper" startOffset="50%" text-anchor="middle" textLength="8.5" lengthAdjust="spacingAndGlyphs">ANDREA</textPath></text>
      <text class="identity-symbol__name"><textPath href="#identity-name-lower" startOffset="50%" text-anchor="middle" textLength="6" lengthAdjust="spacingAndGlyphs">TANG</textPath></text>
      <path class="identity-symbol__growth" d="M22 22h8v8h-8z"/>
    </svg>
  </div>
</section>
<section class="writing" aria-labelledby="writing-title">
  <div class="section-heading">
    <h2 id="writing-title">Latest writing</h2>
    <a href="/archive/">View archive <span aria-hidden="true">→</span></a>
  </div>
  <div class="post-list">{{post_list}}</div>
</section>
