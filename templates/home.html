<section class="intro">
  <div class="identity-hero">
    <h1>A Piece<br>in Progress.</h1>
    <svg class="identity-symbol" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <path id="identity-name-top" d="M12.5 13a6.5 6.5 0 0 0 13 0"/>
        <path id="identity-name-bottom" d="M12.5 14a6.5 6.5 0 0 1 13 0"/>
      </defs>
      <path class="identity-symbol__body" fill-rule="evenodd" d="M2 2h17c6.1 0 11 4.9 11 11s-4.9 11-11 11h-7v6H2V2Zm10 8v6h7a3 3 0 1 0 0-6h-7Z"/>
      <text class="identity-symbol__name"><textPath href="#identity-name-bottom" startOffset="50%" text-anchor="middle" textLength="10.5" lengthAdjust="spacingAndGlyphs">• ANDREA •</textPath></text>
      <text class="identity-symbol__name"><textPath href="#identity-name-top" startOffset="50%" text-anchor="middle" textLength="8" lengthAdjust="spacingAndGlyphs">• TANG •</textPath></text>
      <path class="identity-symbol__growth" d="M22 22h8v8h-8z"/>
    </svg>
  </div>
</section>
<section class="writing" aria-labelledby="writing-title">
  <div class="section-heading">
    <h2 id="writing-title">Latest writing</h2>
    <a href="/archive/">View archive <span aria-hidden="true">→</span></a>
  </div>
  <div class="post-list">{{post_list}}</div>
</section>
