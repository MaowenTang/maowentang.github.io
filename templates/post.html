<article class="article">
  <header class="article-header">
    <a class="back-link" href="/">← Writing</a>
    <h1>{{post_title}}</h1>
    <p class="article-summary">{{summary}}</p>
    <div class="post-meta"><time datetime="{{date_iso}}">{{date_display}}</time><span class="reading-time">{{default_reading_time}} min read</span></div>
  </header>
  {{reading_experience}}
  <footer class="article-footer">{{tags_html}}<a href="/">More writing →</a></footer>
</article>
